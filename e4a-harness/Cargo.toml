[package]
name = "e4a-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generation harness for engine4agent"
publish = false

[dependencies]
e4a-llm = { path = "../e4a-llm" }
e4a-session = { path = "../e4a-session" }
e4a-store = { path = "../e4a-store" }
e4a-types = { path = "../e4a-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
