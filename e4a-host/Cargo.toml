[package]
name = "e4a-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ACP stdio host for engine4agent"
publish = false
autobins = false

[[bin]]
name = "e4a"
path = "src/main.rs"

[dependencies]
e4a-harness = { path = "../e4a-harness" }
e4a-llm = { path = "../e4a-llm" }
e4a-session = { path = "../e4a-session" }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
