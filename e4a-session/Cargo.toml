[package]
name = "e4a-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable session kernel for agent4agent"
publish = false

[dependencies]
e4a-store = { path = "../e4a-store" }
e4a-types = { path = "../e4a-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
