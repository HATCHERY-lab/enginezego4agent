[package]
name = "ez4a-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generation harness for engine zero for agents"
publish = false

[dependencies]
ez4a-llm = { path = "../ez4a-llm" }
ez4a-session = { path = "../ez4a-session" }
ez4a-store = { path = "../ez4a-store" }
ez4a-types = { path = "../ez4a-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
