[package]
name = "ez4a-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable session kernel for engine zero for agents"
publish = false

[dependencies]
ez4a-store = { path = "../ez4a-store" }
ez4a-types = { path = "../ez4a-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
